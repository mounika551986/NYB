<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Dashboard</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="dashboard">
    <aside class="sidebar">
        <h2>Dashboard</h2>
        <nav>
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Reports</a>
            <a href="#">Settings</a>
        </nav>
    </aside>
    <main class="main">

        
        <header class="header">
            <h1>Welcome Back!</h1>
            <button>Logout</button>
        </header>
</main>

        <section class="cards">
            <div class="card">
                <h3>Users</h3>
                <p>1,250</p>
            </div>

            <div class="card">
                <h3>Sales</h3>
                <p>sale price200</p>
            </div>

            <div class="card">
                <h3>Orders</h3>
                <p>minimum order 320</p>
            </div>

            <div class="card">
                <h3>Visitors</h3>
                <p>minimum 5,400</p>
            </div>
        </section>
        <section class="content">
            <h2>Recent Activity</h2>
            <p>
                main content of the dashboard
            </p>
        </section>
           </main>

</div>

</body>
</html>
