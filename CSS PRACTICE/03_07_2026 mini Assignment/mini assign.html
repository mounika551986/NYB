<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Mini Project</title>

    <link rel="stylesheet" href="mini assign.css">

</head>

<body>

    <!-- Header -->

    <header id="header">

        <h1>My Website</h1>

    </header>


    <!-- Navigation -->

    <nav class="navbar">

        <div>Home</div>

        <div>About</div>

        <div>Services</div>

        <div>Contact</div>

    </nav>


    <!-- About Section -->

    <section class="about">

        <h2>About Us</h2>

        <p>
            This is a simple responsive webpage created using HTML and CSS.
        </p>

    </section>


    <!-- Flexbox Section -->

    <section>

        <h2 class="title">Our Courses</h2>

        <div class="courses">

            <div class="card">
                HTML
            </div>

            <div class="card">
                CSS
            </div>

            <div class="card">
                JavaScript
            </div>

        </div>

    </section>


    <!-- Grid Section -->

    <section>

        <h2 class="title">Gallery</h2>

        <div class="gallery">

            <div class="box">1</div>

            <div class="box">2</div>

            <div class="box">3</div>

            <div class="box">4</div>

            <div class="box">5</div>

            <div class="box">6</div>

        </div>

    </section>


    <!-- Position Example -->

    <section class="parent">

        Parent Box

        <div class="child">

            New

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <p>Copyright © 2026</p>

    </footer>

</body>

</html>
